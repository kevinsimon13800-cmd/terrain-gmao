<head>

<style>
:root{--bg:#eef2f6;--card:#fff;--fg:#0f1f33;--mut:#5d6f86;--line:#d5dde7;--head:#0b2239;--headfg:#fff;--acc:#0a6cc4;--accfg:#fff;--ok:#1f8a5b;--okbg:#dff3ea;--bad:#d1343a;--badbg:#fbe0e1;--warn:#b86e00;--warnbg:#fdecd0;--mod:#2563eb;--modbg:#dce8ff;--sel:#f5b700;--cv:#e6ecf3}
@media (prefers-color-scheme:dark){:root{--bg:#0a1626;--card:#13243a;--fg:#e8eef6;--mut:#93a5bd;--line:#26405e;--head:#06111f;--headfg:#e8eef6;--acc:#4aa3ff;--accfg:#04111f;--ok:#46c28d;--okbg:#103a2b;--bad:#ff6b70;--badbg:#431a1e;--warn:#f0b24a;--warnbg:#4a3412;--mod:#6ea0ff;--modbg:#1a2f5c;--sel:#ffd23f;--cv:#0d1d30;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
header.top{background:var(--head);color:var(--headfg);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex:0 0 auto}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:11.5px;opacity:.75;font-weight:400;display:block}
main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));display:none}
.page.on{display:block}
.page.cvpage{padding:0;overflow:hidden}
nav.tabs{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;color:var(--mut);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc);font-weight:650}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--mod);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;line-height:18px;padding:0 5px;text-align:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;min-height:44px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.small{font-size:13px}
input[type=search],input[type=text],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:7px 13px;font-size:14px;min-height:36px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:650}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px;min-height:56px;cursor:pointer}
.item .adr{font-weight:700;font-size:17px;min-width:64px}
.item .zn{font-size:12.5px;color:var(--mut)}
.pill{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12.5px;font-weight:650;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.mod{background:var(--modbg);color:var(--mod)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mod);flex:0 0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mut)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:var(--cv);display:block}
.cvbar{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));z-index:3;pointer-events:none}
.cvbar>*{pointer-events:auto}
.cvbar select{width:auto;flex:1;min-width:0;min-height:40px;padding:6px 10px;opacity:.96}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 12px;min-height:40px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--accfg)}
.cvfab{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.cvfab.up{bottom:128px}
.cvfab button{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.legend{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:12px;z-index:3;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:3px;opacity:.95}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mini{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:12px;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.35);display:none}
.mini.on{display:block}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.sheetbg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{left:50%;transform:translateX(-50%);width:640px}}
.sheet h2{margin:0;font-size:22px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;min-height:58px}
.lvl .n{font-weight:800;font-size:18px;width:34px;text-align:center}
.lvl .t{flex:1;min-width:0;font-size:13px;color:var(--mut)}
.tog{min-width:132px;border-radius:10px;border:2px solid var(--ok);background:var(--okbg);color:var(--ok);font-weight:700;min-height:44px;padding:6px 8px}
.tog.hs{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.tog.chg{box-shadow:0 0 0 3px var(--mod)}
.mont{display:flex;gap:8px}
.mont .tog{flex:1}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:14px 2px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#14273f;color:#fff;border-radius:20px;padding:9px 16px;z-index:40;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty h2{color:var(--fg);margin:8px 0}
a.lnk{color:var(--acc)}
</style>

<body>
<header class="top"><h1 id="ttl">Terrain GMAO<span class="sub" id="sub">Aucun fichier charg&eacute;</span></h1><button class="btn sm" id="btnLoadTop" style="display:none">Fichier</button></header>
<main>

 <button data-t="cv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Plan 3D</button>

 <button data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>R&eacute;glages</button>
</nav>
<div class="sheetbg" id="sbg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" style="display:none">
<script>
(function () {
"use strict";
/* ============ Etat et stockage ============ */
var K_EXP = "gt.exp.v1", K_MODS = "gt.mods.v1", K_SET = "gt.set.v1";
var mem = {};
function lsGet(k) { try { var v = localStorage.getItem(k); return v === null ? (mem[k] || null) : v; } catch (e) { return mem[k] || null; } }
function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
var S = { exp: null, R: {}, byAddr: {}, mods: {}, set: { par: "", mail: "" }, tab: "list", filtre: "tous", zone: "", q: "", sel: null, view: "plan", blk: 0, sheet: null };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
function aujourdhui() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function frDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : ""; }
function frDateHeure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) return ""; return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear() + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
function toast(t) { var el = $("toast"); el.textContent = t; el.className = "toast on"; clearTimeout(toast.h); toast.h = setTimeout(function () { el.className = "toast"; }, 2600); }

function sauverMods() { var ok = lsSet(K_MODS, JSON.stringify(S.mods)); if (!ok) toast("Stockage plein : les modifications ne sont pas conservées si vous fermez l'app."); }
function sauverSet() { lsSet(K_SET, JSON.stringify(S.set)); }
function indexer() {
  S.R = {}; S.byAddr = {};
  if (!S.exp) return;
  for (var i = 0; i < S.exp.racks.length; i++) { S.R[S.exp.racks[i].id] = S.exp.racks[i]; S.byAddr[S.exp.racks[i].a.toUpperCase()] = S.exp.racks[i]; }
}
function charger() {
  try { var e = lsGet(K_EXP); if (e) S.exp = JSON.parse(e); } catch (x) { S.exp = null; }
  try { var m = lsGet(K_MODS); if (m) S.mods = JSON.parse(m) || {}; } catch (x2) { S.mods = {}; }
  try { var s = lsGet(K_SET); if (s) { var o = JSON.parse(s); S.set.par = o.par || ""; S.set.mail = o.mail || ""; } } catch (x3) { }
  indexer();
}
function validerExport(d) {
  if (!d || typeof d !== "object" || d.format !== "GMAO-TERRAIN" || !d.racks || !d.racks.length) return "Ce n'est pas un fichier « Terrain » du GMAO (Terrain_….json).";
  return "";
}

/* ============ Etat des racks (base + modifications) ============ */
function eqList(a, b) { if (a.length !== b.length) return false; var x = a.slice().sort(), y = b.slice().sort(); for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false; return true; }
function base(r) { return { bad: (r.bad || []).slice(), mb: (r.mb || []).slice(), c: r.c || "" }; }
function eff(id) { var m = S.mods[id]; if (m) return { bad: m.apres.bad.slice(), mb: m.apres.mb.slice(), c: m.apres.c }; return base(S.R[id]); }
function estHs(e) { return e.bad.length > 0 || e.mb.length > 0; }
function modif(id) {
  var r = S.R[id], m = S.mods[id];
  if (!r) return null;
  if (!m) { m = S.mods[id] = { a: r.a, avant: base(r), apres: base(r), d: aujourdhui(), sent: false }; }
  m.d = aujourdhui(); m.sent = false;
  return m;
}
function nettoyerMod(id) {
  var m = S.mods[id];
  if (m && eqList(m.avant.bad, m.apres.bad) && eqList(m.avant.mb, m.apres.mb) && m.avant.c === m.apres.c) delete S.mods[id];
}
function basculerNiveau(id, n) {
  var m = modif(id), i = m.apres.bad.indexOf(n);
  if (i === -1) m.apres.bad.push(n); else m.apres.bad.splice(i, 1);
  m.apres.bad.sort(function (a, b) { return a - b; });
  nettoyerMod(id); sauverMods();
}
function basculerMontant(id, k) {
  var m = modif(id), i = m.apres.mb.indexOf(k);
  if (i === -1) m.apres.mb.push(k); else m.apres.mb.splice(i, 1);
  nettoyerMod(id); sauverMods();
}
function fixerRemarque(id, t) {
  var r = S.R[id]; if (!r) return;
  var m = S.mods[id];
  if (!m && t === (r.c || "")) return;
  m = modif(id); m.apres.c = t;
  nettoyerMod(id); sauverMods();
}
function annulerRack(id) { delete S.mods[id]; sauverMods(); }
function nbMods() { var n = 0, k; for (k in S.mods) if (S.mods.hasOwnProperty(k)) n++; return n; }
function reconcilier() {
  var k, m, r, b;
  for (k in S.mods) if (S.mods.hasOwnProperty(k)) {
    m = S.mods[k]; r = S.R[k];
    if (!r) { var r2 = S.byAddr[(m.a || "").toUpperCase()]; if (r2) { S.mods[r2.id] = m; delete S.mods[k]; } else delete S.mods[k]; continue; }
    b = base(r);
    if (eqList(b.bad, m.apres.bad) && eqList(b.mb, m.apres.mb) && b.c === m.apres.c) delete S.mods[k];
  }
}
function dateHs(r, n) { return r.dt && r.dt[n] ? r.dt[n] : ""; }
function plusAncienneHs(r) { var d = "9999", k; for (k in (r.dt || {})) if (r.dt.hasOwnProperty(k) && r.dt[k] && r.dt[k] < d) d = r.dt[k]; return d; }

/* ============ Liste ============ */
function zones() { var z = [], v = {}, i; if (!S.exp) return z; for (i = 0; i < S.exp.racks.length; i++) if (!v[S.exp.racks[i].z]) { v[S.exp.racks[i].z] = 1; z.push(S.exp.racks[i].z); } return z.sort(); }
function ordreNat(a, b) { return String(a).localeCompare(String(b), "fr", { numeric: true }); }
function filtrer() {
  var res = [], i, r, e, q = S.q.replace(/\s+/g, "").toUpperCase();
  for (i = 0; i < S.exp.racks.length; i++) {
    r = S.exp.racks[i]; e = eff(r.id);
    if (S.zone && r.z !== S.zone) continue;
    if (q && r.a.toUpperCase().replace(/\s+/g, "").indexOf(q) === -1 && (r.c || "").toUpperCase().indexOf(S.q.toUpperCase()) === -1) continue;
    if (S.filtre === "hs" && !estHs(e)) continue;
    if (S.filtre === "mod" && !S.mods[r.id]) continue;
    if (S.filtre === "ras" && estHs(e)) continue;
    if (S.filtre === "rem" && !e.c) continue;
    res.push(r);
  }
  if (S.filtre === "hs") res.sort(function (a, b) { var x = plusAncienneHs(a), y = plusAncienneHs(b); return x === y ? ordreNat(a.a, b.a) : (x < y ? -1 : 1); });
  else res.sort(function (a, b) { return ordreNat(a.a, b.a); });
  return res;
}
function resumeHs(r, e) {
  var t = [];
  if (e.bad.length) t.push(e.bad.length + " niveau" + (e.bad.length > 1 ? "x" : "") + " HS (" + e.bad.join(", ") + ")");
  if (e.mb.length) t.push((e.mb.length > 1 ? "2 montants" : "montant " + (e.mb[0] === "G" ? "gauche" : "droit")) + " HS");
  return t.join(" · ");
}
function ligneRack(r) {
  var e = eff(r.id), hs = estHs(e), m = S.mods[r.id];
  var h = '<div class="item" data-id="' + esc(r.id) + '">';
  h += '<div class="adr">' + esc(r.a) + "</div><div class=\"grow\"><div>";
  h += hs ? '<span class="pill bad">' + esc(resumeHs(r, e)) + "</span>" : '<span class="pill ok">RAS</span>';
  if (e.c) h += ' <span class="pill warn">remarque</span>';
  h += '</div><div class="zn">' + esc(r.z) + " · " + r.n + " niv." + (r.p ? " · " + r.p + " pal." : "") + (hs && plusAncienneHs(r) !== "9999" && plusAncienneHs(r) ? " · HS depuis " + frDate(plusAncienneHs(r)) : "") + "</div></div>";
  if (m) h += '<span class="dot" title="modifié sur le terrain"></span>';
  return h + "</div>";
}
function rendreListe() {
